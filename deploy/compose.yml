name: chat-web-service

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '20m'
        max-file: '30'

services:
    task-service:
        image: ${IMAGE:?IMAGE is required}
        container_name: chat-web-task-service
        restart: unless-stopped
        logging: *default-logging
        init: true
        env_file:
            - ${ENV_FILE:-.env}
        environment:
            NODE_ENV: production
            PORT: 5010
            TZ: ${TZ:-Asia/Shanghai}
        # 与其他服务一致发布宿主机端口，由 Windows 防火墙限制入口；接口仍不经 Gateway /api 对外暴露，
        # Gateway 通过 Nacos 注册的容器网卡 IP 访问 /feign/task。
        ports:
            - '${HOST_BIND_IP:-0.0.0.0}:5010:5010'
        expose:
            - '5010'
        networks:
            - infrastructure
        stop_grace_period: 20s

networks:
    infrastructure:
        external: true
        name: ${DOCKER_NETWORK:-chat-web-infrastructure}
